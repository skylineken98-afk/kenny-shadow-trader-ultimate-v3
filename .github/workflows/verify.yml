name: Verify KST
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: kst_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests tests_options tests_chat tests_pro
        env:
          KST_TEST_DATABASE_URL: postgresql://postgres:test_only@localhost:5432/kst_test
      - run: python -m compileall -q kst_chat kst_options kst_pro core
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tests_pro --ignore-scripts
      - run: node tests_pro/database-smoke.cjs
