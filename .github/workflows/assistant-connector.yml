name: Assistant connector checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r kst_mcp/requirements-dev.txt
      - run: python -m unittest discover -s tests_mcp -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: kst_mcp
      - run: node --test callbacks.test.js
        working-directory: kst_mcp
      - run: npm run build
        working-directory: kst_mcp
      - run: docker build -f Dockerfile.mcp -t kst-mcp-test .
